<div style="display: flex; flex-direction: column; gap: 8px;">
  <app-scope-bar what="Color grading" verb="grade" />

  <!-- Controls stay hidden while the scope resolves to no clips: they would
       otherwise look editable but write to nothing. -->
  @if (state.getTargetClipIds().length > 0) {

    <!-- Color Grading & Look Presets -->
    <div style="background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px;">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <div class="qa-title mb-0" style="font-size: 0.82rem; font-weight: 700;">🎨 Color Grading & Look Presets</div>
        <button class="link" type="button" style="font-size: .75rem" (click)="state.resetScopeColorGrading()">
          ↺ Reset
        </button>
      </div>
      <p class="muted" style="font-size: .74rem; margin: 0 0 .6rem">
        Instant live styling applied to the Master Monitor.
      </p>
      <div class="filter-presets-grid">
        @for (preset of state.filterPresets; track preset.id) {
          <div class="filter-preset-card"
               [class.active]="state.activeScopeColorSetting().filter === preset.id"
               (click)="state.setScopeFilter(preset.id)">
            <div class="filter-swatch" [style.background]="preset.swatch"></div>
            <span>{{ preset.label }}</span>
          </div>
        }
      </div>

      <div class="d-flex flex-column gap-2" style="margin-top: .85rem">
        <div>
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label style="font-size: .75rem; margin-bottom: 0;">Brightness</label>
            <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-1 font-monospace" style="font-size: 0.72rem;"
                    (click)="state.setScopeBrightness(100)" title="Click to reset to 100%">
              {{ state.activeScopeColorSetting().brightness }}%
            </button>
          </div>
          <input type="range" class="form-range w-100" min="70" max="140" step="2"
                 [ngModel]="state.activeScopeColorSetting().brightness"
                 (ngModelChange)="state.setScopeBrightness($event)" />
        </div>
        <div>
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label style="font-size: .75rem; margin-bottom: 0;">Contrast</label>
            <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-1 font-monospace" style="font-size: 0.72rem;"
                    (click)="state.setScopeContrast(100)" title="Click to reset to 100%">
              {{ state.activeScopeColorSetting().contrast }}%
            </button>
          </div>
          <input type="range" class="form-range w-100" min="70" max="150" step="2"
                 [ngModel]="state.activeScopeColorSetting().contrast"
                 (ngModelChange)="state.setScopeContrast($event)" />
        </div>
        <div>
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label style="font-size: .75rem; margin-bottom: 0;">Saturation</label>
            <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-1 font-monospace" style="font-size: 0.72rem;"
                    (click)="state.setScopeSaturation(100)" title="Click to reset to 100%">
              {{ state.activeScopeColorSetting().saturation }}%
            </button>
          </div>
          <input type="range" class="form-range w-100" min="0" max="200" step="5"
                 [ngModel]="state.activeScopeColorSetting().saturation"
                 (ngModelChange)="state.setScopeSaturation($event)" />
        </div>
      </div>
    </div>
  }
</div>
